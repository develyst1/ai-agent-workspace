# TEMPLATE: Next.js front with `output: "standalone"` and a build that copies .next/static + public into
# .next/standalone (skill deploy-ready-build). Proven live on blueprint-front (2026-10-31).
# Copy to <repo>/.github/workflows/deploy-sit.yml and replace:
#   __APP__     the app name made by `new-app` (e.g. blueprint-sit)
#   __SERVER__  the server IP or host (SERVER-FACTS)
# The test step runs the repo's Playwright spec that needs no back end (on blueprint: test:isolation, uses the
# runner's Google Chrome). Use the repo's own fast UI test, or remove the step and say so (preflight gate 6).
# Repo secrets, added BEFORE the first push: DEPLOY_SSH_KEY (a CI-only key for this repo), DEPLOY_KNOWN_HOSTS.
name: deploy-sit

on:
  push:
    branches: [sit]
  workflow_dispatch:

concurrency:
  group: deploy-sit
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run --if-present typecheck
      - run: bun run --if-present lint
      # `build` runs next build and copies .next/static + public into .next/standalone.
      - run: bun run build
      - run: bun run --if-present test:isolation
      - run: tar -czf app.tgz -C .next/standalone .
      - name: deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes deploy@__SERVER__ __APP__ < app.tgz
